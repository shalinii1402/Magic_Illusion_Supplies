<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MysticArcana</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-section {
            padding: 20px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
        }



        .auth-box {
            background: var(--bg-card);
            padding: 30px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.6s ease-out;
            max-height: 95vh;
            overflow-y: auto;
            scrollbar-width: none;
            /* Hide scrollbar for Firefox */
            -ms-overflow-style: none;
            /* Hide scrollbar for IE/Edge */
        }

        .auth-box::-webkit-scrollbar {
            display: none;
            /* Hide scrollbar for Chrome/Safari */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-box h2 {
            margin-bottom: 5px;
            color: var(--text-primary);
            font-size: 1.8rem;
            text-shadow: none;
        }

        .subtitle {
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        .auth-box input[type="text"],
        .auth-box input[type="email"],
        .auth-box input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: var(--bg-card);
            transform: translateY(-1px);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
        }

        .terms-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .terms-container input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .separator:not(:empty)::before {
            margin-right: 1em;
        }

        .separator:not(:empty)::after {
            margin-left: 1em;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .auth-footer {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .auth-footer a:hover {
            color: var(--secondary-color);
            text-shadow: 0 0 8px var(--secondary-glow);
            text-decoration: underline;
        }

        .auth-footer a:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .auth-brand {
            margin-bottom: 35px;
            /* Increased spacing */
            text-decoration: none;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .auth-brand img {
            height: 35px;
            width: auto;
            filter: drop-shadow(0 0 10px var(--primary-glow));
            flex-shrink: 0;
        }

        .auth-brand span {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .auth-brand span i {
            font-style: normal;
            color: var(--primary-color);
        }

        @media (max-height: 700px) {
            .auth-box {
                padding: 20px 30px;
            }

            .auth-brand {
                margin-bottom: 25px;
            }

            .auth-box h2 {
                font-size: 1.5rem;
            }

            .subtitle {
                margin-bottom: 10px;
            }

            .auth-footer {
                margin-top: 10px;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .auth-box {
                margin: 20px 0;
            }
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 20px;
            }

            .auth-brand span {
                font-size: 1.3rem;
            }

            .auth-brand img {
                height: 35px;
            }



            .social-login {
                flex-direction: column;
                /* Stacking logic for mobile */
                gap: 12px;
            }

            .social-btn {
                width: 100%;
                /* Make social buttons full width */
                height: 50px;
            }
        }

        .terms-link {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            padding: 2px 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .terms-link:hover {
            color: var(--secondary-color);
            background: rgba(var(--primary-rgb), 0.1);
            text-decoration: underline;
        }

        .terms-link:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 2px;
            background: rgba(var(--primary-rgb), 0.15);
        }
    </style>
</head>

<body>



    <div class="auth-section">
        <div class="auth-box reveal fade-up">
            <a href="index.html" class="auth-brand">
                <img src="assets/images/logo.png" alt="MysticArcana Logo">
                <span>Mystic<i>Arcana</i></span>
            </a>

            <h2>Join the Order</h2>
            <p class="subtitle">Start your magical journey today</p>

            <form id="signup-form">
                <div class="input-group">
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                </div>

                <label class="terms-container">
                    <input type="checkbox" id="terms-checkbox">
                    <span>I have accepted the <a href="#" class="terms-link">Terms &
                            Conditions</a></span>
                </label>

                <button type="submit" id="signup-btn" class="btn btn-primary" style="width: 100%; padding: 14px;"
                    disabled>Create Account</button>
            </form>

            <div class="separator">OR continue with</div>

            <div class="social-login">
                <a href="#" class="social-btn google" title="Sign up with Google">
                    <i class="fab fa-google"></i>
                </a>
                <a href="#" class="social-btn facebook" title="Sign up with Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
            </div>

            <div class="auth-footer">
                Already a member? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="back-to-top" aria-label="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
    <script>
        const togglePassword = document.querySelector('#toggle-password');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        const termsCheckbox = document.querySelector('#terms-checkbox');
        const signupBtn = document.querySelector('#signup-btn');
        termsCheckbox.addEventListener('change', function () {
            signupBtn.disabled = !this.checked;
        });
    </script>
</body>

</html>
