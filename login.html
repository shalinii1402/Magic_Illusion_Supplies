<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MysticArcana</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-section {
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            position: relative;
            overflow-x: hidden;
            /* Prevents horizontal overflow/drifting on tablets */
        }

        /* Floating Theme Toggle */
        .floating-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .floating-toggle:hover {
            transform: scale(1.1);
            color: var(--primary-color);
            box-shadow: 0 15px 30px var(--primary-glow);
        }

        .auth-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-box h2 {
            margin-bottom: 8px;
            color: var(--text-primary);
            font-size: 2rem;
            text-shadow: none;
        }

        .subtitle {
            margin-bottom: 30px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: var(--bg-card);
            transform: translateY(-1px);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .separator:not(:empty)::before {
            margin-right: 1em;
        }

        .separator:not(:empty)::after {
            margin-left: 1em;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .auth-footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .auth-footer a:hover {
            color: var(--secondary-color);
            text-shadow: 0 0 8px var(--secondary-glow);
            text-decoration: underline;
        }

        .auth-footer a:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            margin: 0;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary-color);
            font-weight: 500;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .auth-brand {
            margin-bottom: 35px;
            text-decoration: none;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .auth-brand img {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 0 10px var(--primary-glow));
            flex-shrink: 0;
        }

        .auth-brand span {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .auth-brand span i {
            font-style: normal;
            color: var(--primary-color);
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .floating-toggle {
                top: 20px;
                right: 20px;
            }

            .auth-box {
                margin: 20px 0;
            }
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 20px;
            }

            .auth-brand span {
                font-size: 1.3rem;
            }

            .auth-brand img {
                height: 35px;
            }

            .floating-toggle {
                width: 40px;
                height: 40px;
            }

            .auth-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <button class="floating-toggle" id="theme-toggle" aria-label="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="auth-section">
        <div class="auth-box reveal fade-up">
            <a href="index.html" class="auth-brand">
                <img src="assets/images/logo.png" alt="MysticArcana Logo">
                <span>Mystic<i>Arcana</i></span>
            </a>

            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your magical credentials to continue</p>

            <form id="login-form">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Login</button>
            </form>

            <div class="separator">OR continue with</div>

            <div class="social-login">
                <a href="#" class="social-btn google" title="Login with Google">
                    <i class="fab fa-google"></i>
                </a>
                <a href="#" class="social-btn facebook" title="Login with Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="back-to-top" aria-label="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
    <script>
        const togglePassword = document.querySelector('#toggle-password');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>

</html>
